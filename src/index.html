<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cholab GraphPad</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="qpcr-core.js?v=__QPCR_CORE_VERSION__"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #d8dee6;
      --panel: #ffffff;
      --panel-soft: #f5f7fa;
      --chrome: #eef2f6;
      --chrome-dark: #26384d;
      --ink: #14212b;
      --muted: #5f6d7a;
      --line: #c9d2dc;
      --line-strong: #aeb9c5;
      --teal: #0b7770;
      --teal-soft: #dcefeb;
      --blue: #2d65b0;
      --blue-soft: #e1ecfa;
      --indigo: #4757a8;
      --coral: #c94d3b;
      --amber: #b7791f;
      --green: #2f855a;
      --shadow: 0 10px 28px rgba(29, 45, 63, 0.13);
      --shadow-soft: 0 2px 10px rgba(29, 45, 63, 0.08);
      --radius: 6px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .topbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 14px;
      border-bottom: 1px solid #172739;
      background: linear-gradient(180deg, #314a66, #23364d);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 1px 0 rgba(255,255,255,.08) inset;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #45a6d9, #116bba 54%, #113c73);
      color: #fff;
      box-shadow: 0 0 0 1px rgba(255,255,255,.22) inset, 0 6px 16px rgba(0,0,0,.18);
    }

    .brand-title {
      display: flex;
      align-items: center;
    }

    .brand-title strong {
      font-size: 15px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ribbon {
      display: flex;
      align-items: stretch;
      gap: 0;
      min-height: 82px;
      padding: 8px 12px 7px;
      background:
        linear-gradient(180deg, #fbfcfd, #e7edf4);
      border-bottom: 1px solid #b6c2cf;
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 2px 8px rgba(29,45,63,.08);
      position: sticky;
      top: 44px;
      z-index: 35;
      overflow-x: auto;
    }

    .ribbon-group {
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 5px;
      min-width: max-content;
      padding: 0 12px;
      border-right: 1px solid #c7d0db;
    }

    .ribbon-group:first-child {
      padding-left: 0;
    }

    .ribbon-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 46px;
    }

    .ribbon-title {
      color: #536272;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .ribbon-btn {
      min-width: 58px;
      min-height: 46px;
      display: grid;
      place-items: center;
      gap: 3px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #253545;
      padding: 5px 7px;
      font-size: 11px;
      font-weight: 750;
    }

    .ribbon-btn svg {
      color: #2d65b0;
    }

    .ribbon-group:nth-child(2) .ribbon-btn svg {
      color: #0b7770;
    }

    .ribbon-group:nth-child(3) .ribbon-btn svg {
      color: #c94d3b;
    }

    .ribbon-group:nth-child(4) .ribbon-btn svg {
      color: #2f855a;
    }

    .ribbon-btn:hover {
      border-color: #aab7c6;
      background: linear-gradient(180deg, #fff, #eaf1f8);
      box-shadow: var(--shadow-soft);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
      width: 100%;
      max-width: 1880px;
      margin: 0 auto;
    }

    .left-rail,
    .main-rail {
      min-width: 0;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .left-rail {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    #figureStylePanel {
      order: 5;
    }

    .main-rail {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .panel-head {
      min-height: 36px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, #fbfcfe, #edf2f7);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .panel-body {
      padding: 12px;
    }

    .guide-panel .panel-body {
      display: grid;
      gap: 10px;
    }

    .guide-lead {
      margin: 0;
      color: #33465a;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
    }

    .guide-block {
      border: 1px solid #d3dbe4;
      border-radius: 5px;
      background: #fbfcfe;
      overflow: hidden;
    }

    .guide-block summary {
      min-height: 34px;
      padding: 8px 10px;
      background: linear-gradient(180deg, #fff, #eef4fa);
      color: #173a63;
      font-size: 12px;
      font-weight: 850;
    }

    .guide-content {
      display: grid;
      gap: 8px;
      padding: 10px 12px 12px;
      color: #374956;
      font-size: 12px;
      line-height: 1.55;
    }

    .guide-content ol,
    .guide-content ul {
      margin: 0;
      padding-left: 18px;
    }

    .guide-content li + li {
      margin-top: 5px;
    }

    .guide-note {
      padding: 8px 10px;
      border-left: 3px solid #2d65b0;
      background: #eef5ff;
      color: #28425f;
      font-size: 12px;
      line-height: 1.5;
    }

    .auto-card {
      display: grid;
      gap: 8px;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #b8cbe3;
      border-radius: 5px;
      background: linear-gradient(180deg, #f8fbff, #edf5ff);
      color: #28425f;
    }

    .auto-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 850;
    }

    .auto-card-body {
      color: #405366;
      font-size: 12px;
      line-height: 1.5;
    }

    .auto-card-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 7px;
    }

    .auto-card-actions .field {
      flex: 1 1 160px;
      max-width: 100%;
    }

    .graph-option-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 2px;
    }

    .graph-option-btn {
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid #b9c7d8;
      border-radius: 5px;
      background: linear-gradient(180deg, #fff, #eef4fa);
      color: #29445f;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset;
    }

    .graph-option-btn:hover {
      border-color: #7ea4cf;
      color: #12375f;
    }

    .graph-option-btn.active {
      border-color: #2d65b0;
      background: linear-gradient(180deg, #2d65b0, #1f4f91);
      color: #fff;
    }

    .graph-option-btn.recommended:not(.active) {
      border-color: #7fa5cf;
      background: linear-gradient(180deg, #f6fbff, #dcecff);
      color: #123d6f;
      box-shadow: 0 0 0 1px rgba(45,101,176,.14) inset;
    }

    .graph-option-btn.recommended::after {
      content: " 추천";
      font-size: 10px;
      font-weight: 900;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      padding: 4px;
      background: #dfe6ee;
      border-radius: 5px;
      border: 1px solid var(--line);
    }

    .tab-btn {
      min-height: 32px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #4f5f70;
      font-weight: 800;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #fff, #f0f5fa);
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(255,255,255,.85) inset, 0 1px 5px rgba(29,45,63,.12);
    }

    .pane {
      display: none;
    }

    .pane.active {
      display: grid;
      gap: 10px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field-grid.one {
      grid-template-columns: 1fr;
    }

    .field.span-2 {
      grid-column: 1 / -1;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    label,
    .field-label {
      color: #33424c;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: linear-gradient(180deg, #fff, #f9fbfd);
      color: var(--ink);
      padding: 8px 10px;
      outline: none;
      box-shadow: 0 1px 0 rgba(255,255,255,.9) inset;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2d65b0;
      box-shadow: 0 0 0 3px rgba(45, 101, 176, 0.14);
    }

    input[type="file"] {
      padding: 7px;
      font-size: 12px;
    }

    input[type="color"] {
      width: 100%;
      min-height: 36px;
      padding: 4px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
    }

    .style-mode-copy {
      margin: 0;
      color: #5b6876;
      font-size: 12px;
      line-height: 1.5;
    }

    .advanced-style-block {
      margin-top: 12px;
    }

    .compact-fields {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
      padding: 5px;
      border-radius: 8px;
      background: #e7edf3;
      border: 1px solid var(--line);
    }

    .segmented.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .segmented label {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 32px;
      border-radius: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      overflow: hidden;
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label:has(input:checked) {
      background: linear-gradient(180deg, #fff, #f3f7fb);
      color: var(--ink);
      box-shadow: 0 2px 10px rgba(23, 32, 38, 0.08);
    }

    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: linear-gradient(180deg, #fff, #eef3f8);
      color: var(--ink);
      padding: 8px 12px;
      font-weight: 750;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: #9aaab5;
      background: linear-gradient(180deg, #fff, #e6edf5);
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(180deg, #347bc6, #1f5fa4);
      border-color: #1f5fa4;
      box-shadow: 0 1px 0 rgba(255,255,255,.28) inset, 0 7px 16px rgba(31, 95, 164, 0.22);
    }

    .btn.primary:hover {
      background: linear-gradient(180deg, #3c85d1, #1d5795);
      border-color: #1d5795;
    }

    .btn.icon {
      width: 36px;
      padding: 0;
    }

    .btn.small {
      min-height: 32px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 11px;
      border-radius: 7px;
      background: #f5f7fa;
      border: 1px solid var(--line);
      color: #33424c;
      font-size: 12px;
    }

    .status.ok {
      background: #edf8f2;
      border-color: #c9e8d5;
      color: #245c3e;
    }

    .status.warn {
      background: #fff7e7;
      border-color: #ecd298;
      color: #6f4a12;
    }

    .status.bad {
      background: #fff0ef;
      border-color: #f0c0bb;
      color: #8a3326;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 5px;
      background: linear-gradient(180deg, #fff, #edf3f8);
      color: #384853;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
    }

    .chip b {
      color: var(--ink);
      font-size: 12px;
    }

    .chip-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex-wrap: wrap;
    }

    .plot-card {
      min-width: 0;
      overflow: hidden;
      background: #bdc8d4;
      position: sticky;
      top: 140px;
      max-height: calc(100vh - 152px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      align-self: start;
    }

    .plot-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid #9daaba;
      background: linear-gradient(180deg, #f8fbfe, #e2eaf3);
    }

    .check-row {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 8px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: linear-gradient(180deg, #fff, #eef3f8);
      color: #31424f;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .check-row input {
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .plot-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .plot-title-copy {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .plot-title h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .plot-title p {
      margin: 0;
      color: #5d6b79;
      font-size: 11px;
      font-weight: 700;
    }

    .output-tabs {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border: 1px solid #aeb9c5;
      border-radius: 5px;
      background: #edf3f8;
    }

    .output-tab {
      min-height: 30px;
      padding: 5px 9px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #3b4a57;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .output-tab.active {
      color: #fff;
      background: linear-gradient(180deg, #2d65b0, #1f4f8e);
      box-shadow: 0 1px 2px rgba(22, 38, 57, .18);
    }

    .output-tab:focus-visible {
      outline: 2px solid #153f74;
      outline-offset: 2px;
    }

    .output-pane {
      min-height: 0;
      overflow: auto;
      background: #f7fafc;
    }

    .output-pane[data-output-pane="preview"] {
      overflow: hidden;
      background: #bdc8d4;
    }

    .result-pane {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .result-pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .result-pane-head h3 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0;
    }

    #plot {
      width: 100% !important;
      max-width: none;
      height: min(64vh, 700px);
      min-height: 460px;
      background: #fff;
      overflow: hidden;
      border: 1px solid #9daaba;
      box-shadow: 0 0 0 12px #e8edf2, 0 13px 30px rgba(30, 45, 60, .18);
    }

    .plot-stage {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background: #bdc8d4;
      scrollbar-gutter: stable;
    }

    #plot .plot-container,
    #plot .svg-container {
      max-width: 100% !important;
    }

    .plot-empty {
      height: min(64vh, 720px);
      min-height: 460px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid #9daaba;
      box-shadow: 0 0 0 12px #e8edf2, 0 13px 30px rgba(30, 45, 60, .18);
      background:
        linear-gradient(90deg, rgba(210,218,226,.72) 1px, transparent 1px),
        linear-gradient(0deg, rgba(210,218,226,.72) 1px, transparent 1px),
        #fff;
      background-size: 36px 36px;
      margin: 0;
    }

    #plot:not(.hidden) {
      margin: 0;
      width: 100% !important;
    }

    .empty-inner {
      width: min(420px, 90%);
      padding: 20px;
      text-align: center;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--line);
      border-radius: 5px;
      box-shadow: 0 12px 30px rgba(23,32,38,.08);
    }

    .empty-inner strong {
      display: block;
      color: var(--ink);
      margin-bottom: 5px;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: linear-gradient(180deg, #f9fbfd, #eaf0f6);
      color: #33424c;
      font-weight: 800;
    }

    tbody tr:nth-child(even) td {
      background: #fbfcfe;
    }

    tbody tr:hover td {
      background: #edf5ff;
    }

    tr:last-chil…55299 tokens truncated…sions() {
      const style = getFigureStyle();
      const count = Math.max(state.figureGrids.length, 1);
      const columns = figureGridColumnCount(count);
      const rows = Math.ceil(count / columns);
      const defaultWidth = Math.min(4200, Math.max(1800, columns * 1450));
      const defaultHeight = Math.min(3600, Math.max(1350, rows * 1100));
      return {
        width: style.styleMode === "advanced" && style.figureWidth > 0 ? style.figureWidth : defaultWidth,
        height: style.styleMode === "advanced" && style.figureHeight > 0 ? style.figureHeight : defaultHeight
      };
    }

    function downloadCurrentCsv() {
      const rows = state.summaryRows.length ? state.summaryRows : state.resultRows;
      if (!rows.length) {
        showToast("다운로드할 표가 없습니다.");
        return;
      }
      downloadBlob(toCsv(rows), `${state.currentFilename || "cholab_results"}.csv`, "text/csv;charset=utf-8");
    }

    function downloadCurrentXlsx() {
      if (!window.XLSX) {
        showToast("XLSX 라이브러리를 불러오지 못했습니다.");
        return;
      }
      const wb = XLSX.utils.book_new();
      const summary = state.summaryRows.length ? state.summaryRows : state.resultRows;
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), "SUMMARY");
      if (state.resultRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.resultRows), "CALC_DETAILS");
      if (state.warningRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.warningRows), "WARNINGS");
      if (state.mode === "qPCR" && state.qpcrRows.length) {
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.qpcrRows), "ORIGINAL_TABLE");
      }
      const notes = [
        { item: "Generated by", value: "Cholab GraphPad" },
        { item: "Date", value: new Date().toISOString() }
      ];
      if (state.mode === "qPCR" && state.qpcrResult?.notes?.length) {
        state.qpcrResult.notes.forEach((note, index) => notes.push({ item: `qPCR note ${index + 1}`, value: note }));
      }
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(notes), "NOTES");
      XLSX.writeFile(wb, `${state.currentFilename || "cholab_results"}.xlsx`);
    }

    function downloadBlob(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function toCsv(rows) {
      const cols = getColumns(rows);
      const quote = (v) => {
        const s = formatCell(v);
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      return [cols.map(quote).join(","), ...rows.map((r) => cols.map((c) => quote(r[c])).join(","))].join("\n");
    }

    function makeQpcrSampleRows() {
      const targets = ["GAPDH", "MLH1", "MSH2", "MSH6"];
      const samples = ["HELA", "HCT116", "HEK293T"];
      const baseline = {
        HELA: { GAPDH: 18.2, MLH1: 24.3, MSH2: 23.8, MSH6: 25.1 },
        HCT116: { GAPDH: 18.5, MLH1: 26.0, MSH2: 23.3, MSH6: 24.0 },
        HEK293T: { GAPDH: 18.0, MLH1: 23.8, MSH2: 24.5, MSH6: 25.8 }
      };
      const rows = [];
      let well = 1;
      samples.forEach((sample, si) => {
        for (let bio = 1; bio <= 3; bio++) {
          targets.forEach((target, ti) => {
            for (let tech = 1; tech <= 3; tech++) {
              const jitter = (bio - 2) * 0.18 + (tech - 2) * 0.06 + Math.sin((si + 1) * (ti + 2) * (bio + tech)) * 0.05;
              rows.push({
                Well: `A${well++}`,
                Fluor: "SYBR",
                Target: target,
                Content: "Unkn",
                Sample: `${sample}_BioRep${bio}`,
                Cq: round(baseline[sample][target] + jitter, 3)
              });
            }
          });
        }
      });
      rows.push({ Well: `A${well++}`, Fluor: "SYBR", Target: "GAPDH", Content: "NTC", Sample: "NTC", Cq: "" });
      return rows;
    }

    function detectQpcrColumns(rows) {
      if (window.CholabQpcrCore) {
        const requestedCycle = $("qpcrCycleColumn")?.value || state.qpcrCycleColumn || "auto";
        const mapping = CholabQpcrCore.detectColumns(rows, requestedCycle);
        return {
          well: mapping.well,
          target: mapping.target,
          sample: mapping.sample,
          biogroup: mapping.biogroup,
          rq: mapping.rq,
          rqMin: mapping.rqMin,
          rqMax: mapping.rqMax,
          ct: mapping.cycle,
          availableCycleColumns: mapping.availableCycleColumns
        };
      }
      const cols = getColumns(rows);
      return {
        well: findColumnName(cols, ["Well", "Well Position", "Position", "Well ID", "WellID"]),
        target: findColumnName(cols, ["Target", "Target Name", "TargetName", "Gene", "Gene Symbol", "Gene Name", "Assay", "Assay Name", "Detector", "유전자", "타겟"]),
        sample: findColumnName(cols, ["Sample", "Sample Name", "SampleName", "Sample ID", "SampleID", "Specimen", "Condition", "Treatment", "Group", "샘플", "조건", "그룹"]),
        biogroup: findColumnName(cols, ["Bio Group Name", "Biogroup Name", "BioGroup Name"]),
        rq: findColumnName(cols, ["Rq", "RQ", "Relative Quantity", "Relative Expression"]),
        rqMin: findColumnName(cols, ["Rq Min", "RQ Min", "Relative Quantity Min"]),
        rqMax: findColumnName(cols, ["Rq Max", "RQ Max", "Relative Quantity Max"]),
        ct: findColumnName(cols, ["Cq", "Ct", "CP", "Cp", "Cq Mean", "Ct Mean", "Mean Cq", "Mean Ct", "Mean Equivalent Cq", "Mean Adjusted Equivalent Cq", "Mean Equivalent Ct", "Mean Adjusted Equivalent Ct", "Cycle Threshold", "Threshold Cycle", "Quantification Cycle"])
      };
    }

    function requireColumns(mapping, keys) {
      const missing = keys.filter((key) => !mapping[key]);
      if (missing.length) throw new Error(`필수 column을 찾지 못했습니다: ${missing.join(", ")}`);
    }

    function findColumnName(cols, candidates) {
      const normCandidates = candidates.map(normalize);
      return cols.find((col) => normCandidates.includes(normalize(col))) ||
        cols.find((col) => normCandidates.some((needle) => needle.length >= 3 && normalize(col).includes(needle))) ||
        "";
    }

    function normalize(x) {
      return String(x ?? "")
        .trim()
        .toLowerCase()
        .replace(/[µμ]/g, "u")
        .replace(/[Δ∆]/g, "delta")
        .replace(/[^\p{L}\p{N}]+/gu, "");
    }

    function value(row, col) {
      return col ? row[col] : "";
    }

    function cleanName(x) {
      return String(x ?? "").trim();
    }

    function parseCt(x) {
      const s = cleanName(x);
      if (!s || /undetermined|undet|n\/a|na/i.test(s)) return NaN;
      return parseNumber(s);
    }

    function parseNumber(x) {
      if (typeof x === "number") return Number.isFinite(x) ? x : NaN;
      let s = cleanName(x)
        .replace(/\u2212/g, "-")
        .replace(/[<>≤≥≈~]/g, "")
        .replace(/\s+/g, "");
      if (!s) return NaN;
      s = s.replace(/%$/, "");
      if (/^-?\d+,\d+$/.test(s) && !s.includes(".")) s = s.replace(",", ".");
      else s = s.replace(/,/g, "");
      const n = Number(s);
      if (Number.isFinite(n)) return n;
      const match = s.match(/^-?\d*\.?\d+(?:e[-+]?\d+)?/i);
      if (!match) return NaN;
      const parsed = Number(match[0]);
      return Number.isFinite(parsed) ? parsed : NaN;
    }

    function parseList(text) {
      return String(text || "").split(",").map((s) => s.trim()).filter(Boolean);
    }

    function parseBioRepFromSample(sample) {
      if (window.CholabQpcrCore) return CholabQpcrCore.parseBioRepFromSample(sample);
      const s = cleanName(sample);
      const patterns = [
        /^(.+?)[\s_-]*(?:B|BioRep|Bio|BR|BRep)[\s_-]*(\d+)$/i,
        /^(.+?)[\s_-]*(?:Replicate|Rep|R)[\s_-]*(\d+)$/i,
        /^(.+?)[\s_-]+(\d+)$/i
      ];
      for (const pattern of patterns) {
        const match = s.match(pattern);
        if (match) return { base: cleanName(match[1]), bioRep: Number(match[2]) };
      }
      return { base: s, bioRep: NaN };
    }

    function orderedUnique(values) {
      const out = [];
      const seen = new Set();
      values.forEach((v) => {
        const key = String(v ?? "").trim();
        if (key && !seen.has(key)) {
          seen.add(key);
          out.push(v);
        }
      });
      return out;
    }

    function firstPreferred(items, preferred) {
      return preferred.find((item) => items.includes(item)) || items[0] || "";
    }

    function groupBy(items, keyFn) {
      const map = new Map();
      items.forEach((item) => {
        const key = keyFn(item);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      });
      return map;
    }

    function mean(vals) {
      const arr = vals.filter(Number.isFinite);
      return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN;
    }

    function median(vals) {
      const arr = vals.filter(Number.isFinite).sort((a, b) => a - b);
      if (!arr.length) return NaN;
      const mid = Math.floor(arr.length / 2);
      return arr.length % 2 ? arr[mid] : (arr[mid - 1] + arr[mid]) / 2;
    }

    function sd(vals) {
      const arr = vals.filter(Number.isFinite);
      if (arr.length <= 1) return NaN;
      const m = mean(arr);
      return Math.sqrt(arr.reduce((sum, v) => sum + Math.pow(v - m, 2), 0) / (arr.length - 1));
    }

    function sem(vals) {
      const arr = vals.filter(Number.isFinite);
      return arr.length > 1 ? sd(arr) / Math.sqrt(arr.length) : NaN;
    }

    function round(x, digits = 5) {
      return Number.isFinite(Number(x)) ? Number(Number(x).toPrecision(digits)) : "";
    }

    function clampInt(value, min, max, fallback) {
      const n = Number.parseInt(value, 10);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    function errorValue(point, mode) {
      if (mode === "sd") return Number.isFinite(point.SD) ? point.SD : 0;
      if (mode === "ci95") return Number.isFinite(point.SEM) ? point.SEM * 1.96 : 0;
      if (mode === "sem") return Number.isFinite(point.SEM) ? point.SEM : 0;
      return 0;
    }

    function describeGroups(rows) {
      const grouped = groupBy(rows, (r) => `${r.x}|||${r.group}`);
      const out = [];
      grouped.forEach((sub, key) => {
        const [x, group] = key.split("|||");
        const vals = sub.map((r) => r.y);
        out.push({ x, group, n: vals.length, mean: round(mean(vals)), median: round(median(vals)), SD: round(sd(vals)), SEM: round(sem(vals)), min: round(Math.min(...vals)), max: round(Math.max(...vals)) });
      });
      return out;
    }

    function linearFit(xs, ys) {
      const pairs = xs.map((x, i) => [x, ys[i]]).filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
      if (pairs.length < 2) return null;
      const x = pairs.map((p) => p[0]);
      const y = pairs.map((p) => p[1]);
      const mx = mean(x);
      const my = mean(y);
      const ssx = x.reduce((s, v) => s + Math.pow(v - mx, 2), 0);
      if (ssx === 0) return null;
      const slope = x.reduce((s, v, i) => s + (v - mx) * (y[i] - my), 0) / ssx;
      const intercept = my - slope * mx;
      const sst = y.reduce((s, v) => s + Math.pow(v - my, 2), 0);
      const ssr = y.reduce((s, v, i) => s + Math.pow(v - (slope * x[i] + intercept), 2), 0);
      return { x, slope, intercept, r2: sst ? 1 - ssr / sst : 1 };
    }

    function fitFourPL(points) {
      const data = points.filter((p) => p.x > 0 && Number.isFinite(p.y));
      if (data.length < 4) return null;
      const logs = data.map((p) => Math.log10(p.x));
      const ys = data.map((p) => p.y);
      const ymin = Math.min(...ys);
      const ymax = Math.max(...ys);
      const minLog = Math.min(...logs);
      const maxLog = Math.max(...logs);
      let best = null;
      for (let hill = -3; hill <= 3; hill += 0.15) {
        if (Math.abs(hill) < 0.05) continue;
        for (let step = 0; step <= 100; step++) {
          const logIC50 = minLog - 1 + ((maxLog - minLog + 2) * step / 100);
          const params = { bottom: ymin, top: ymax, logIC50, hill };
          const sse = data.reduce((sum, p) => sum + Math.pow(p.y - fourPL(p.x, params), 2), 0);
          if (!best || sse < best.sse) best = { ...params, sse };
        }
      }
      return best;
    }

    function fourPL(x, p) {
      return p.bottom + (p.top - p.bottom) / (1 + Math.pow(10, (p.logIC50 - Math.log10(x)) * p.hill));
    }

    function logSpace(start, end, n) {
      const out = [];
      for (let i = 0; i < n; i++) out.push(Math.pow(10, start + (end - start) * i / (n - 1)));
      return out;
    }

    function numericAwareCompare(a, b) {
      const na = parseNumber(a);
      const nb = parseNumber(b);
      if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
      return String(a).localeCompare(String(b));
    }

    function centeredOffset(index, count, totalWidth) {
      if (count <= 1) return 0;
      const width = totalWidth / count;
      return -totalWidth / 2 + width / 2 + index * width;
    }

    function jitterOffset(index, count, width) {
      if (count <= 1) return 0;
      return -width + (2 * width * index) / (count - 1);
    }

    function labelForPlot(type) {
      return {
        bar: "Bar + dots",
        grouped_bar: "Grouped bar",
        line: "Line",
        scatter: "Scatter",
        box: "Box",
        violin: "Violin",
        histogram: "Histogram",
        heatmap: "Heatmap",
        dose_response: "Dose response",
        volcano: "Volcano"
      }[type] || type;
    }

    function safeFilename(name) {
      return String(name || "cholab_figure").trim().replace(/[^\w가-힣.-]+/g, "_").replace(/^_+|_+$/g, "") || "cholab_figure";
    }

    function formatCell(value) {
      if (value == null) return "";
      if (typeof value === "number") return Number.isFinite(value) ? String(round(value, 6)) : "";
      if (value instanceof Date) return value.toISOString().slice(0, 10);
      return String(value);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[ch]));
    }

    function debounce(fn, wait) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    init();
